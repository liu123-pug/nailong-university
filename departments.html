    <p>奶龙大学现有以下主要院系（玩梗版简介）：</p>

    <section class="dept-list">
      <article class="dept">
        <h3>奶学系</h3>
        <p>核心课程：奶香学、奶泡力学、奶制品化学。毕业去向：奶企研发、奶茶店创始人、奶龙养成师。</p>
      </article>

      <article class="dept">
        <h3>人文学院</h3>
        <p>培养具备奶龙文化素养的文史哲人才，会在毕业季朗诵奶龙诗。</p>
      </article>

      <article class="dept">
        <h3>理工学院</h3>
        <p>专业涵盖：计算机、电子、材料学（重点研究“可拉伸奶皮”）。</p>
      </article>

      <article class="dept">
        <h3>商学院</h3>
        <p>教你如何把“奶龙”做成品牌与独角兽（奶龙）企业。</p>
